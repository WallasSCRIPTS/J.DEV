<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>

<form>


    <section> 

    <h2> Formulario de Inscrição </h2>

    <label for="nome">Digite seu nome completo</label>
    <input id="nome" type="text" name="nome" placeholder="Nome" required>
    <br>
    <label for="email">Digite seu email</label>
    <input id="email" type="email" name="email" placeholder="Email" required>
    <br>
    <label for="idade">Digite sua idade</label>
    <input id="idade" type="number" name="idade" placeholder="Idade" min="0" required>
    <br>
    <label for="senha">Digite sua senha</label>
    <input id="senha" type="password" name="senha" placeholder="Senha" required>
    <br>
    <label for="telefone">Digite seu telefone</label>
    <input id="telefone" type="tel" name="telefone" placeholder="Telefone">
    <br>
    <label for="endereco">Digite seu endereço</label>
    <input id="endereco" type="text" name="endereco" placeholder="Endereço">
    <br>
    <label for="cidade">Digite sua cidade</label>
    <input id="cidade" type="text" name="cidade" placeholder="Cidade">
    </section>

    <section> 

        <h2> Gênero </h2>

        <input type="radio" name="genero" value="feminino"> Feminino
        <br>
        <input type="radio" name="genero" value="masculino"> Masculino
        <br>
        <input type="radio" name="genero" value="outro"> Outro
    </section>


    <section>
        <h2> Mensagem</h2>
        <textarea name="mensagem" rows="5" cols="30" placeholder="Digite sua mensagem"></textarea>
        Selecione o assunto da mensagem:
        <br>
        <input type="text" name="assunto" placeholder="Digite o assunto da mensagem">
        <br>
        <button type="submit">Enviar sua mensagem</button>
    </section>

    <section>
        <h2> Foto de perfil</h2>
        <input type="file" name="foto" accept="image/*">
    </section>

</form>

</body>
</html>
